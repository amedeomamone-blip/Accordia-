        <div class="bintro-scroll" id="bintro-scroll">

                    <section class="bintro-screen" data-screen="1" aria-label="Schermata 1: Gioco dell'eco">
                        <div class="barocco-header">
                            <span class="barocco-intro__eyebrow">ATTIVITÀ</span>

                                <span class="barocco-ticker__overlay" aria-hidden="true">
                                    <span class="barocco-ticker__blob barocco-ticker__blob--1"></span>
                                    <span class="barocco-ticker__blob barocco-ticker__blob--2"></span>
                                    <span class="barocco-ticker__blob barocco-ticker__blob--3"></span>
                                    <span class="barocco-ticker__blob barocco-ticker__blob--4"></span>
                                </span>
                            </div>
                        </div>

                        <div class="brl brl--echo" id="brl-echo">
                            <div class="brl__toolbar">
                                <div class="brl__tempo" role="group" aria-label="Velocit&agrave; del metronomo">
                                    <span class="brl__tempo-label">
                                        <svg class="brl__tempo-icon" viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M7.1 20h9.8l-1.7-13H8.8L7.1 20Z"></path>
                                            <path d="M12 6.5 14.4 2"></path>

                                            <circle cx="12" cy="16.5" r="1"></circle>

                                    </span>
                                    <div class="brl__tempo-options">
                                        <button class="brl__tempo-option" type="button" data-beat-length="1000" aria-pressed="false" aria-label="Lento, 60 battiti al minuto">Lento</button>
                                        <button class="brl__tempo-option is-active" type="button" data-beat-length="714" aria-pressed="true" aria-label="Andante, 84 battiti al minuto">Andante</button>
                                        <button class="brl__tempo-option" type="button" data-beat-length="500" aria-pressed="false" aria-label="Allegro, 120 battiti al minuto">Allegro</button>
                                    </div>
                                    <button class="brl__metronome-toggle" id="brl-metronome-toggle" type="button" aria-pressed="false">Avvia</button>
                                </div>

                                <div class="brl__patterns">
                                    <div class="brl__pattern-options" role="group" aria-label="Scegli la sequenza">

                                        <button class="brl__pattern" type="button" aria-label="Sequenza 4" aria-pressed="false" data-pattern="3">4</button>
                                        <button class="brl__pattern" type="button" aria-label="Sequenza 5" aria-pressed="false" data-pattern="4">5</button>
                                    </div>
                                </div>
                            </div>

                            <div class="brl__track">
                                <div class="brl__sequence">
                                    <div class="brl__row brl__row--main" id="brl-echo-grid" aria-label="Frase in esecuzione"></div>
                                    <div class="brl__preview">

                                    </div>
                                </div>
                            </div>

                            <div class="brl__controls">
                                <button class="brl__primary" id="brl-echo-play" type="button" aria-pressed="false">Ascolta</button>

                            </div>
