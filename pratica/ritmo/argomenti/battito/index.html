    <main class="bintro-stage" id="bintro-stage">

        <nav class="bintro-progress" aria-label="Navigazione schermate">
            <button class="bintro-progress__dot is-active" type="button" aria-label="Schermata 1: Gioco dell'eco"></button>
            <button class="bintro-progress__dot" type="button" aria-label="Schermata 2: Componiamo una battuta"></button>
        </nav>

        <div class="bintro-scroll" id="bintro-scroll">
            <div class="bintro-pin" id="bintro-pin">
                <div class="bintro-screens" id="bintro-screens">

                    <section class="bintro-screen" data-screen="1" aria-label="Schermata 1: Gioco dell'eco">
                        <div class="barocco-header">
                            <span class="barocco-intro__eyebrow">Attivit&agrave; 01 &middot; Ascolto e risposta</span>
                            <div class="barocco-intro__title-wrap">
                                <h2 class="barocco-intro__title">Gioco dell&rsquo;eco</h2>
                            </div>
                        </div>

                        <div class="brl" id="brl-echo">
                            <div class="brl__patterns" role="tablist" aria-label="Scegli il ritmo">
                                <button class="brl__pattern is-active" type="button" role="tab" aria-selected="true" data-pattern="0">1</button>
                                <button class="brl__pattern" type="button" role="tab" aria-selected="false" data-pattern="1">2</button>
                                <button class="brl__pattern" type="button" role="tab" aria-selected="false" data-pattern="2">3</button>
                                <button class="brl__pattern" type="button" role="tab" aria-selected="false" data-pattern="3">4</button>
                                <button class="brl__pattern" type="button" role="tab" aria-selected="false" data-pattern="4">5</button>
                            </div>

                            <div class="brl__track">
                                <div class="brl__row" id="brl-echo-grid" aria-label="Sequenza ritmica di quattro movimenti"></div>
                            </div>

                            <div class="brl__controls">
                                <button class="brl__primary" id="brl-echo-play" type="button">Ascolta</button>
                                <p class="brl__status" id="brl-echo-status" aria-live="polite"></p>
                            </div>
                        </div>
                    </section>

                    <section class="bintro-screen" data-screen="2" aria-label="Schermata 2: Componiamo una battuta">
                        <div class="barocco-header">
                            <span class="barocco-intro__eyebrow">Attivit&agrave; 02 &middot; Creazione</span>
                            <div class="barocco-intro__title-wrap">
                                <h2 class="barocco-intro__title">Componiamo una battuta</h2>
                            </div>
                        </div>

                        <div class="brl brl--composer" id="brl-composer">
                            <div class="brl__sounds" aria-label="Suoni disponibili">
                                <button class="brl__sound" type="button" data-sound="cosce">Cosce</button>
                                <button class="brl__sound" type="button" data-sound="mani">Mani</button>
                                <button class="brl__sound" type="button" data-sound="petto">Petto</button>
                                <button class="brl__sound" type="button" data-sound="piedi">Piedi</button>
                                <button class="brl__sound" type="button" data-sound="silenzio">Silenzio</button>
                            </div>

                            <div class="brl__track">
                                <div class="brl__row" id="brl-compose-grid" aria-label="Battuta da comporre">
                                    <button class="brl__tile is-empty is-selected" type="button" data-slot="0" aria-label="Primo movimento, vuoto"><span class="brl__tile-label">+</span></button>
                                    <button class="brl__tile is-empty" type="button" data-slot="1" aria-label="Secondo movimento, vuoto"><span class="brl__tile-label">+</span></button>
                                    <button class="brl__tile is-empty" type="button" data-slot="2" aria-label="Terzo movimento, vuoto"><span class="brl__tile-label">+</span></button>
                                    <button class="brl__tile is-empty" type="button" data-slot="3" aria-label="Quarto movimento, vuoto"><span class="brl__tile-label">+</span></button>
                                </div>
                            </div>

                            <div class="brl__controls brl__controls--composer">
                                <button class="brl__secondary" id="brl-compose-clear" type="button">Cancella</button>
                                <button class="brl__primary" id="brl-compose-play" type="button">Suona</button>
                                <p class="brl__status" id="brl-compose-status" aria-live="polite"></p>
                            </div>
                        </div>
                    </section>

                </div>
            </div>
        </div>
