/* Vertical lesson navigation, shared interaction model with Figure musicali. */
body{overflow:hidden}
.lesson-deck{position:relative;min-height:0}
.lesson-viewport{position:relative;height:100%;min-height:0;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none;padding-right:40px}
.lesson-viewport::-webkit-scrollbar{display:none}
.lesson-slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.lesson-progress.topic-rail{position:absolute;top:50%;right:8px;z-index:2;display:flex;flex-direction:column;gap:2px;transform:translateY(-50%);padding:0;border:0;background:transparent;box-shadow:none;backdrop-filter:none}
.lesson-progress.topic-rail button{display:grid;place-items:center;width:44px;height:44px;min-height:44px;padding:0;border:0;background:transparent;color:var(--score-accent)}
.lesson-progress button span{display:block;width:6px;height:6px;border-radius:50%;background:var(--score-accent);opacity:.25;transition:transform .25s ease,opacity .25s ease}
.lesson-progress button[aria-pressed=true] span{opacity:1;transform:scale(1.55)}
.lesson-progress button:hover span{opacity:.75}
.lesson-viewport:focus-visible{outline-offset:-3px}
@media(min-width:1600px){.lesson-progress.topic-rail{right:24px}}
@media(max-width:700px){.lesson-deck{min-height:0}.deck-header{flex-direction:row;align-items:center}.identity{width:auto;flex:1;flex-wrap:wrap;justify-content:flex-start;gap:4px 12px}.identity h1{font-size:17px}.deck-nav{width:auto}.full-button{font-size:12px}.lesson-viewport{padding-right:28px}.lesson-progress.topic-rail{right:0}.lesson-progress.topic-rail button{width:36px}.lesson-progress button span{width:5px;height:5px}}
@media(prefers-reduced-motion:reduce){.lesson-progress button span{transition:none}}

/* The overview uses the full lateral space, including on wide LIM displays. */
.lesson-deck{max-width:none}
.deck-header,.deck-footer{width:100%;max-width:1752px;margin-inline:auto}
#scoreSlide{width:100%;max-width:1712px;margin-inline:auto}
#overviewSlide #overview{gap:6px}

/* The current pulse glows while the next entries approach a fixed reading line. */
.score-beat text{fill:#64705b}
.score-beat .beat-wash{fill:#eaf0e3;opacity:0}
.score-beat.is-current .beat-wash{opacity:.72}
.score-beat.is-current text{fill:#263e19;font-weight:800}
#scoreStrip{will-change:transform}

/* Original score dimensions and one steady reading band. */
.scorewrap{overflow:hidden}
.note-event .event-bg,.attack-marker,.beat-wash{display:none!important}
.score-beat.is-current text{fill:#263e19;font-weight:800}
.reading-band{pointer-events:none}
.gesture-icon{opacity:1}

<script>
'use strict';
const $=id=>document.getElementById(id),names=['Tamburello','Legnetti','Triangolo'],colors=['#7952B5','#148E91','#C28C19'];
// Otto crome per battuta: valori negativi = pause. Identici alle schede cartacee.
const P={tamb:[-2,2,-2,2],tambRefrain:[-2,2,-2,1,1],
 woodVerse:[2,1,1,2,-2],woodFull:[1,1,2,1,1,2],
 triangleVerse:[2,-2,-4],triangleFull:[2,-2,-2,-2]};
const writingPatterns=[
 {strofa:['R','Q','R','Q'],pre:['R','Q','R','Q'],ritornello:['R','Q','R','EE']},
 {strofa:['Q','EE','Q','R'],pre:['EE','Q','EE','Q'],ritornello:['EE','Q','EE','Q']},
 {strofa:['Q','R','H','CONT'],pre:['Q','R','R','R'],ritornello:['Q','R','R','R']}
];
const sectionForBar=b=>b<12?'Strofa':b<20?'Pre-ritornello':'Ritornello';
const firstSectionBar=b=>b===0||b===12||b===20;
const song=Array.from({length:32},(_,b)=>b<12
 ?[P.tamb,P.woodVerse,P.triangleVerse]
 :b<20?[P.tamb,P.woodFull,P.triangleFull]
        :[P.tambRefrain,P.woodFull,P.triangleFull]);
function events(pattern){let n=0;return pattern.map(v=>{const e={start:n,d:Math.abs(v),rest:v<0};n+=e.d;return e})}
for(const bar of song)for(const part of bar)if(part.reduce((a,v)=>a+Math.abs(v),0)!==8)throw Error('Battuta incompleta');
let data=song,page=0,position=0,mode='listen',solo=-1;
let running=false,starting=false,ctx=null,master=null,analyser=null,voiceGains=[],noiseBuffer=null;
let origin=0,saved=-8,nextStep=-8,timer=null,frame=0,startToken=0,bpm=80,lastBeatLabel='';
const sources=new Set(),enabled=[true,true,true],volume=[.65,.65,.5];
const $S=(tag,attrs,body='')=>`<${tag} ${Object.entries(attrs).map(([k,v])=>`${k}="${v}"`).join(' ')}>${body}</${tag}>`;
const glyphs={4:'\uE1D3',2:'\uE1D5',1:'\uE1D7'},restGlyphs={4:'\uE4E4',2:'\uE4E5'};
const figureNames={4:'minima',2:'semiminima',1:'croma'},values={4:'1/2',2:'1/4',1:'1/8'};
function pageSize(){return 2}
function bounds(){return [Number($('from').value)*8,(Number($('to').value)+1)*8]}
function rangePosition(elapsed,lo,hi){return lo+((elapsed%(hi-lo))+(hi-lo))%(hi-lo)}
function setAudioMessage(message){$('audioState').textContent=message;$('audioNotice').classList.toggle('has-error',/non disponibile|Impossibile|sospeso/i.test(message))}
function setup(){
 $('mixer').innerHTML=names.map((n,i)=>`<div class="channel" style="--voice:${colors[i]}"><b>${n}</b><label><input type="checkbox" data-enable="${i}" checked>Ascolta voce</label><div class="voice-actions"><button data-solo="${i}" aria-label="Solo ${n}" aria-pressed="false">Solo</button><button data-test="${i}" aria-label="Prova ${n}">Prova</button></div><label>Volume <input aria-label="Volume ${n}" type="range" data-volume="${i}" min="0" max="1" step=".05" value="${volume[i]}"></label></div>`).join('');
 $('voiceKey').innerHTML=names.map((n,i)=>`<span style="--voice:${colors[i]}"><i></i>${['Ta','Le','Tr'][i]} · ${n}</span>`).join('');
 $('overview').innerHTML=song.map((bar,b)=>{
  let mini='';bar.forEach((part,i)=>{
   const y=15+i*23;mini+=$S('text',{x:0,y:y+4,'font-size':16,fill:colors[i]},['Ta','Le','Tr'][i]);
   for(const e of events(part)){const x=30+e.start*20,w=e.d*20;mini+=e.rest?$S('line',{x1:x+4,x2:x+w-4,y1:y,y2:y,stroke:'#8c9982','stroke-width':1.6}):$S('circle',{cx:x+4,cy:y,r:4.5,fill:colors[i]})+$S('line',{x1:x+4,x2:x+w-4,y1:y,y2:y,stroke:colors[i],'stroke-width':1.5})}
  });return `<button data-bar="${b}" aria-label="Vai alla battuta ${b+1}, ${sectionForBar(b)}"><span class="bar-title"><b>${b+1}</b><span>${firstSectionBar(b)?sectionForBar(b):''}</span></span><svg viewBox="0 0 194 80" aria-hidden="true">${mini}</svg></button>`
 }).join('');ranges();reset();
}
let activeSlide='score';
const lessonViewport=$('lessonViewport');
const slideNames=['score','overview'];
function markSlide(id){
 activeSlide=id;
 document.querySelectorAll('[data-slide]').forEach(button=>{
  const selected=button.dataset.slide===id;
  button.setAttribute('aria-pressed',String(selected));
  if(selected)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');
 });
}
function showSlide(id){
 if(!slideNames.includes(id))return;
 const behavior=window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
 lessonViewport.scrollTo({top:$(id+'Slide').offsetTop,behavior});
}
// Wheel, trackpad and touch stay native; observing scroll only updates the dots.
lessonViewport.addEventListener('scroll',()=>{
 const index=Math.min(slideNames.length-1,Math.max(0,Math.round(lessonViewport.scrollTop/Math.max(1,lessonViewport.clientHeight))));
 markSlide(slideNames[index]);
},{passive:true});
if('ResizeObserver' in window){
 const viewportObserver=new ResizeObserver(()=>lessonViewport.scrollTo({top:$(activeSlide+'Slide').offsetTop,behavior:'auto'}));
 viewportObserver.observe(lessonViewport);
}
function ranges(){for(const id of ['from','to'])$(id).innerHTML=data.map((_,i)=>`<option value="${i}">${i+1}</option>`).join('');$('to').value=data.length-1}
// A rolling SVG window. Absolute musical time drives geometry and highlighting;
// recycling an off-screen measure never changes the position of a visible note.
function createScoreStrip(config){
 const {left,span,rows,describe,svg,height=540}=config,bw=span/2,unitWidth=bw/8,anchor=left+100,offset=6;
 const stripId=svg==='score'?'scoreStrip':svg+'Strip',cursorId=svg==='score'?'cursor':svg+'Cursor',clipId=svg+'Clip',bandId=svg+'Pulse';
 const tag=(name,attrs,body='')=>`<${name} ${Object.entries(attrs).map(([k,v])=>`${k}="${v}"`).join(' ')}>${body}</${name}>`;
 let base=null,revision=0,cache='',nodes=[],beats=[],lastTime=0;
 function invalidate(){revision++;cache=''}
 function paint(time,lit){
  time=Math.max(0,time);lastTime=time;
  const first=Math.floor(time/8)-1,key=`${first}:${revision}`;
  if(cache!==key){
   base=first;cache=key;let moving='';
   for(let b=first;b<first+5;b++){
    const bar=describe(b);if(!bar)continue;const x=(b-first)*bw;
    moving+=tag('text',{class:'measure-heading',x:x+offset,y:25,'font-size':20,'font-weight':700,fill:'#34452a'},bar.label);
    for(let beat=0;beat<4;beat++){
     const start=b*8+beat*2,bx=x+beat*bw/4;
     moving+=tag('g',{class:'score-beat','data-start':start},tag('text',{x:bx+offset,y:55,'font-size':19},beat+1));
    }
    rows.forEach((row,i)=>{
     const y=row.y;
     moving+=tag('line',{x1:x,x2:x,y1:y-row.above,y2:y+row.below,stroke:'#b5c0ac'});
     moving+=tag('line',{x1:x,x2:x+bw,y1:y,y2:y,stroke:'#cbd3c4'});
     for(const e of events(bar.parts[i])){
      const ex=x+e.start*unitWidth,cx=ex+offset,w=e.d*unitWidth;
      let inner=tag('title',{},`${names[i]}: ${e.rest?'pausa di ':''}${figureNames[e.d]}`);
      if(config.icons){
       if(e.rest)inner+=tag('line',{class:'gesture-rest',x1:cx,x2:ex+w-12,y1:y,y2:y,stroke:'#adb5a6','stroke-width':2});
       else {const size=Math.min(112,w-12);inner+=tag('image',{class:'gesture-icon',href:config.icons[i],x:cx-6,y:y-size*.62,width:size,height:size,preserveAspectRatio:'xMidYMid meet'});}
      }else{
       inner+=tag('text',{class:'music note-ink',x:cx,y},e.rest?config.rests[e.d]:glyphs[e.d]);
       if($('durations').checked)inner+=tag('text',{class:'note-value',x:cx,y:y+row.valueY,'font-size':row.valueSize,fill:'#54634b'},values[e.d]);
      }
      if(config.resonance&&i===2&&!e.rest){
       inner+=tag('line',{class:'resonance',x1:cx+34,x2:ex+w-12,y1:y+14,y2:y+14,stroke:colors[i],'stroke-width':2});
       inner+=tag('text',{x:ex+w-12,y:y+44,'text-anchor':'end','font-size':15,fill:colors[i]},'smorza');
      }
      moving+=tag('g',{class:'note-event','data-start':b*8+e.start,'data-end':b*8+e.start+e.d,'data-rest':e.rest,style:`--voice:${colors[i]}`},inner);
     }
     moving+=tag('line',{x1:x+bw,x2:x+bw,y1:y-row.above,y2:y+row.below,stroke:'#b5c0ac'});
    });
   }
   let fixed=rows.map((row,i)=>tag('text',{class:'voice-label',x:12,y:row.y-2,'font-size':config.labelSize,'font-weight':700,fill:colors[i]},names[i])).join('');
   const band=tag('rect',{id:bandId,class:'reading-band',x:anchor-5,y:64,width:12,height:height-76,fill:'#6f8e54','fill-opacity':.16,visibility:'hidden'});
   fixed+=tag('line',{id:cursorId,x1:anchor,x2:anchor,y1:64,y2:height-12,stroke:'#34452a','stroke-width':1.5,opacity:.7,visibility:'hidden'});
   $(svg).setAttribute('viewBox',`0 0 1200 ${height}`);
   $(svg).innerHTML=tag('defs',{},tag('clipPath',{id:clipId},tag('rect',{x:left,y:0,width:span,height})))+band+tag('g',{'clip-path':`url(#${clipId})`},tag('g',{id:stripId},moving))+fixed;
   document.querySelectorAll(`#${svg} [data-rest="true"] .music`).forEach(n=>{if(!n.getBBox)return;const box=n.getBBox();if(box.height)n.setAttribute('dy',Number(n.getAttribute('y'))-box.y-box.height/2)});
   nodes=[...document.querySelectorAll(`#${svg} .note-event`)];beats=[...document.querySelectorAll(`#${svg} .score-beat`)];
  }
  const translation=anchor-offset-(time-base*8)*unitWidth;
  $(stripId).setAttribute('transform',`translate(${translation} 0)`);
  $(cursorId).setAttribute('visibility',lit?'visible':'hidden');
  $(bandId).setAttribute('visibility',lit?'visible':'hidden');
  const pulse=Math.floor(time/2)*2;
  for(const beat of beats)beat.classList.toggle('is-current',lit&&Number(beat.dataset.start)===pulse);
  for(const g of nodes){const start=Number(g.dataset.start),active=lit&&time>=start&&time<Number(g.dataset.end);g.classList.toggle('is-active',active);g.classList.toggle('is-attack',active&&g.dataset.rest==='false'&&time<start+.32)}
 }
 return {paint,invalidate,get state(){return {time:lastTime,base,unitWidth,anchor,lookahead:(left+span-anchor)/unitWidth}}};
}

let scoreTime=0;
function orchestraBar(index){
 const [lo,hi]=bounds(),length=(hi-lo)/8;
 if(index<0||(!$('loop').checked&&index>=length))return null;
 const b=lo/8+index%length;
 return {parts:data[b],label:`Battuta ${b+1}`};
}
const scoreStrip=createScoreStrip({left:200,span:976,height:540,rows:names.map((_,i)=>({y:155+i*154,above:62,below:50,valueY:44,valueSize:18})),describe:orchestraBar,svg:'score',rests:restGlyphs,labelSize:23,resonance:true});
function scoreLabels(){
 const b=Math.min(data.length-1,Math.floor(position/8));
 $('section').textContent=sectionForBar(b);
 $('scoreSeek').value=b;$('scoreSeek').setAttribute('aria-valuetext',`Battuta ${b+1} di 32`);
 $('pair').textContent=`Battuta ${b+1} / 32`;


 $('score').setAttribute('aria-label',`Partitura scorrevole, battuta ${b+1}: Tamburello, Legnetti e Triangolo`);
}
function render(){scoreStrip.invalidate();scoreLabels();updateHighlight();updateOverview()}
function updateOverview(){document.querySelectorAll('[data-bar]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.bar)===Math.floor(position/8)?'true':'false'))}

function updateHighlight(){
 const t=savedPosition(),visible=(running||saved>=0)&&t>=0&&mode!=='blind';
 if(running)scoreTime=Math.max(0,t);
 scoreStrip.paint(scoreTime,visible);scoreLabels();
}
function savedPosition(){return running?Math.max(saved,(ctx.currentTime-origin)/(30/bpm)):saved}
function stopSources(){for(const source of sources){try{source.stop()}catch{}}sources.clear()}
function halt(){clearInterval(timer);timer=null;cancelAnimationFrame(frame);frame=0;stopSources();$('level').style.transform='scaleX(0)'}
function syncMixer(){if(!ctx)return;voiceGains.forEach((g,i)=>g.gain.setTargetAtTime(enabled[i]&&(solo<0||solo===i)?volume[i]:0,ctx.currentTime,.008))}
function initAudio(){
 if(ctx&&ctx.state!=='closed')return;
 const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('Questo browser non supporta l’audio.');
 ctx=new Audio();master=ctx.createGain();master.gain.value=.8;analyser=ctx.createAnalyser();analyser.fftSize=256;
 const compressor=ctx.createDynamicsCompressor();compressor.threshold.value=-8;compressor.ratio.value=4;
 master.connect(compressor);compressor.connect(analyser);analyser.connect(ctx.destination);
 voiceGains=names.map(()=>{let g=ctx.createGain();g.connect(master);return g});syncMixer();
 noiseBuffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*.18),ctx.sampleRate);const samples=noiseBuffer.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=Math.random()*2-1;
 ctx.onstatechange=()=>{if(ctx.state==='interrupted'||ctx.state==='suspended'){if(running)pause();setAudioMessage('Audio sospeso. Premi Ascolta o Riprendi per riattivarlo.')}};
}
function track(source,cleanup){sources.add(source);source.onended=()=>{sources.delete(source);source.disconnect();cleanup()}}
function oscillator(time,duration,frequency,amplitude,type,destination,endFrequency){
 const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(frequency,time);
 if(endFrequency)o.frequency.exponentialRampToValueAtTime(endFrequency,time+Math.min(.06,duration*.7));
 g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(amplitude,time+.003);g.gain.exponentialRampToValueAtTime(.0001,time+duration);
 o.connect(g);g.connect(destination);track(o,()=>g.disconnect());o.start(time);o.stop(time+duration+.005);

function tone(i,time,duration,test=false){
 const destination=i===3||test?master:voiceGains[i];time=Math.max(time,ctx.currentTime+.002);
 if(i===3){oscillator(time,.05,1150,.18,'sine',destination);return}
 if(i===2){const d=Math.max(.05,duration-.025);oscillator(time,d,1750,.16,'sine',destination);oscillator(time,d,2453,.085,'sine',destination);oscillator(time,d,3511,.04,'sine',destination);return}

function audioFailure(error){running=false;starting=false;halt();$('play').disabled=false;$('play').textContent='Riprova';setAudioMessage(`Audio non disponibile. ${error.message||'Premi Prova audio per riprovare.'}`)}
async function play(){
 if(running||starting)return;
 const token=++startToken;starting=true;$('play').disabled=true;setAudioMessage('Attivazione audio…');
 try{
  // Create/resume from the click itself so browsers can grant playback permission.
  initAudio();await ctx.resume();

  $('play').disabled=false;$('play').textContent='In esecuzione';$('play').disabled=true;setAudioMessage(mode==='listen'?'Ascolto attivo · timbri sintetici.':'Suona tu: '+($('metro').checked?'metronomo attivo.':'metronomo spento.'));

function schedule(){
 if(!running)return;
 const step=30/bpm,[lo,hi]=bounds(),length=hi-lo,horizon=ctx.currentTime+.12;

}
const meterData=new Uint8Array(256);
function animate(){

 else{
  position=rangePosition(elapsed,lo,hi);const b=Math.floor(position/8),count=pageSize();
  page=b;

function pause(){

}
function reset(){

}
async function chooseMode(next){if($('settings').open)$('settings').close();showSlide('score');mode=next;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));reset();await play()}
async function testAudio(i=1){

$('play').onclick=play;$('pause').onclick=pause;$('stop').onclick=()=>{reset();setAudioMessage('Arrestato. Premi Ascolta per ripartire.')};$('home').onclick=()=>{$('from').value=0;reset()};$('testAudio').onclick=()=>testAudio();
let seekResume=false;
$('scoreSeek').onpointerdown=()=>{seekResume=running;pause()};

document.addEventListener('click',e=>{
